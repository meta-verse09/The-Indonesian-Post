name: Auto Post Blogger

on:
  schedule:
    # Berjalan otomatis 2x sehari (Jam 08:00 & 17:00 WIB)
    - cron: '0 1,10 * * *'
  workflow_dispatch: # Supaya bisa dijalankan manual lewat tombol

jobs:
  run-autoblog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python auto_post.py
